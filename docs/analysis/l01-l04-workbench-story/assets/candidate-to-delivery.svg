<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">候选结果到可信交付的断桥</title>
  <desc id="desc">测试绿灯只能到达候选结果，跨越目标、范围、差异、复验与人审后才能到达可信交付。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2457d6"/></marker></defs>
  <rect width="720" height="540" rx="12" fill="#f8faff"/>
  <text x="44" y="56" fill="#172033" font-family="system-ui,sans-serif" font-size="24" font-weight="700">绿灯之后，还缺什么？</text>
  <rect x="44" y="104" width="210" height="116" rx="12" fill="#eef2f8" stroke="#9eabc0"/>
  <text x="149" y="146" text-anchor="middle" fill="#172033" font-family="system-ui,sans-serif" font-size="18" font-weight="700">测试通过</text>
  <text x="149" y="178" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="15">产生候选结果</text>
  <path d="M254 162H320" stroke="#2457d6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M400 162H466" stroke="#2457d6" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <rect x="466" y="104" width="210" height="116" rx="12" fill="#e2f2e9" stroke="#1f6b4c"/>
  <text x="571" y="146" text-anchor="middle" fill="#172033" font-family="system-ui,sans-serif" font-size="18" font-weight="700">人工接受</text>
  <text x="571" y="178" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="15">形成可信交付</text>
  <rect x="316" y="124" width="88" height="76" rx="10" fill="#f8ecd7" stroke="#8a5718" stroke-width="2"/>
  <text x="360" y="154" text-anchor="middle" fill="#8a5718" font-family="system-ui,sans-serif" font-size="14" font-weight="700">证据断桥</text>
  <text x="360" y="178" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="13">不能跳过</text>
  <g font-family="system-ui,sans-serif" font-size="15" fill="#172033">
    <rect x="44" y="286" width="190" height="58" rx="10" fill="#e7edff" stroke="#2457d6"/><text x="139" y="322" text-anchor="middle">目标与非目标</text>
    <rect x="265" y="286" width="190" height="58" rx="10" fill="#e7edff" stroke="#2457d6"/><text x="360" y="322" text-anchor="middle">授权范围与 Diff</text>
    <rect x="486" y="286" width="190" height="58" rx="10" fill="#e7edff" stroke="#2457d6"/><text x="581" y="322" text-anchor="middle">独立复验与人审</text>
    <rect x="110" y="384" width="210" height="58" rx="10" fill="#eef2f8" stroke="#9eabc0"/><text x="215" y="420" text-anchor="middle">实现前红与实现后绿</text>
    <rect x="400" y="384" width="210" height="58" rx="10" fill="#eef2f8" stroke="#9eabc0"/><text x="505" y="420" text-anchor="middle">原始命令、退出码、风险</text>
  </g>
  <path d="M139 344V364H215V384M360 344V364H215M360 364H505M581 344V364H505V384" fill="none" stroke="#9eabc0" stroke-width="2"/>
  <text x="360" y="494" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">绿色说明检查通过，不说明目标正确，也不等于有人接受。</text>
</svg>
