<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">可信交付证据链</title>
  <desc id="desc">原始诉求经人工确认形成 Spec，受控修改后依次经过前后检查、实际差异和独立复验，最终由具名人员决定接受、退回或停止。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect width="1120" height="500" rx="12" fill="#f8faff"/>
  <text x="48" y="54" fill="#172033" font-family="system-ui,sans-serif" font-size="25" font-weight="700">从候选结果到可签收交付</text>
  <text x="48" y="82" fill="#536078" font-family="system-ui,sans-serif" font-size="14">每一步都有输入、输出和责任边界</text>

  <g fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)">
    <path d="M268 160H310"/>
    <path d="M528 160H570"/>
    <path d="M788 160H830"/>
    <path d="M940 214V276"/>
    <path d="M830 330H788"/>
    <path d="M570 330H528"/>
    <path d="M310 330H268"/>
  </g>

  <g font-family="system-ui,sans-serif">
    <g>
      <rect x="48" y="106" width="220" height="108" rx="12" fill="#eef2f8" stroke="#9eabc0"/>
      <circle cx="74" cy="132" r="15" fill="#dfe5ef"/><text x="74" y="137" text-anchor="middle" fill="#536078" font-size="12" font-weight="700">01</text>
      <text x="158" y="151" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">原始诉求</text>
      <text x="158" y="181" text-anchor="middle" fill="#536078" font-size="14">来源与现场问题</text>
    </g>
    <g>
      <rect x="308" y="106" width="220" height="108" rx="12" fill="#f8ecd7" stroke="#8a5718"/>
      <circle cx="334" cy="132" r="15" fill="#efd9b5"/><text x="334" y="137" text-anchor="middle" fill="#8a5718" font-size="12" font-weight="700">02</text>
      <text x="418" y="151" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">人工决定</text>
      <text x="418" y="181" text-anchor="middle" fill="#536078" font-size="14">目标、非目标与口径</text>
    </g>
    <g>
      <rect x="568" y="106" width="220" height="108" rx="12" fill="#e7edff" stroke="#2457d6"/>
      <circle cx="594" cy="132" r="15" fill="#cfdcff"/><text x="594" y="137" text-anchor="middle" fill="#1745bd" font-size="12" font-weight="700">03</text>
      <text x="678" y="151" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">确认版 Spec</text>
      <text x="678" y="181" text-anchor="middle" fill="#536078" font-size="14">约束与验收用例</text>
    </g>
    <g>
      <rect x="828" y="106" width="220" height="108" rx="12" fill="#e7edff" stroke="#2457d6"/>
      <circle cx="854" cy="132" r="15" fill="#cfdcff"/><text x="854" y="137" text-anchor="middle" fill="#1745bd" font-size="12" font-weight="700">04</text>
      <text x="938" y="151" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">受控修改</text>
      <text x="938" y="181" text-anchor="middle" fill="#536078" font-size="14">候选目录与允许写集</text>
    </g>

    <g>
      <rect x="828" y="276" width="220" height="108" rx="12" fill="#eef2f8" stroke="#9eabc0"/>
      <circle cx="854" cy="302" r="15" fill="#dfe5ef"/><text x="854" y="307" text-anchor="middle" fill="#536078" font-size="12" font-weight="700">05</text>
      <text x="938" y="321" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">前后检查</text>
      <text x="938" y="351" text-anchor="middle" fill="#536078" font-size="14">同一命令，前红后绿</text>
    </g>
    <g>
      <rect x="568" y="276" width="220" height="108" rx="12" fill="#eef2f8" stroke="#9eabc0"/>
      <circle cx="594" cy="302" r="15" fill="#dfe5ef"/><text x="594" y="307" text-anchor="middle" fill="#536078" font-size="12" font-weight="700">06</text>
      <text x="678" y="321" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">实际 Diff</text>
      <text x="678" y="351" text-anchor="middle" fill="#536078" font-size="14">新增、删除与越界</text>
    </g>
    <g>
      <rect x="308" y="276" width="220" height="108" rx="12" fill="#eef2f8" stroke="#9eabc0"/>
      <circle cx="334" cy="302" r="15" fill="#dfe5ef"/><text x="334" y="307" text-anchor="middle" fill="#536078" font-size="12" font-weight="700">07</text>
      <text x="418" y="321" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">独立复验</text>
      <text x="418" y="351" text-anchor="middle" fill="#536078" font-size="14">从原始 Spec 检查</text>
    </g>
    <g>
      <rect x="48" y="276" width="220" height="108" rx="12" fill="#e2f2e9" stroke="#1f6b4c"/>
      <circle cx="74" cy="302" r="15" fill="#c7e7d6"/><text x="74" y="307" text-anchor="middle" fill="#1f6b4c" font-size="12" font-weight="700">08</text>
      <text x="158" y="321" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">人工决定</text>
      <text x="158" y="351" text-anchor="middle" fill="#536078" font-size="14">接受、退回或停止</text>
    </g>
  </g>

  <line x1="48" y1="424" x2="1072" y2="424" stroke="#d7deea"/>
  <text x="560" y="459" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">自动化可以检查事实，但不能替人授权范围或签收结果。</text>
</svg>
