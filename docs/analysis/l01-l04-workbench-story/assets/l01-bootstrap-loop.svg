<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">L01 工作台自举环</title>
  <desc id="desc">人先确认完成定义，再做前红、范围内实现、事实记录、后绿与人工判断。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2457d6"/></marker></defs>
  <rect width="1120" height="520" rx="12" fill="#f8faff"/>
  <text x="56" y="58" fill="#172033" font-family="system-ui,sans-serif" font-size="25" font-weight="700">第一次自举：工作台记录自己的诞生</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="60" y="142" width="178" height="100" rx="12" fill="#e7edff" stroke="#2457d6"/><text x="149" y="183" fill="#172033" font-size="17" font-weight="700">人工确认</text><text x="149" y="211" fill="#536078" font-size="14">目标、范围、完成定义</text>
    <rect x="272" y="142" width="178" height="100" rx="12" fill="#f8e5e7" stroke="#a2393f"/><text x="361" y="183" fill="#172033" font-size="17" font-weight="700">同一检查前红</text><text x="361" y="211" fill="#536078" font-size="14">能力尚未存在</text>
    <rect x="484" y="142" width="178" height="100" rx="12" fill="#eef2f8" stroke="#9eabc0"/><text x="573" y="183" fill="#172033" font-size="17" font-weight="700">Codex 实现</text><text x="573" y="211" fill="#536078" font-size="14">只改授权写集</text>
    <rect x="696" y="142" width="178" height="100" rx="12" fill="#e2f2e9" stroke="#1f6b4c"/><text x="785" y="183" fill="#172033" font-size="17" font-weight="700">同一检查后绿</text><text x="785" y="211" fill="#536078" font-size="14">差异可复查</text>
    <rect x="908" y="142" width="152" height="100" rx="12" fill="#e7edff" stroke="#2457d6"/><text x="984" y="183" fill="#172033" font-size="17" font-weight="700">人工判断</text><text x="984" y="211" fill="#536078" font-size="14">接受或退回</text>
  </g>
  <g stroke="#2457d6" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M238 192H267"/><path d="M450 192H479"/><path d="M662 192H691"/><path d="M874 192H903"/></g>
  <rect x="327" y="326" width="466" height="112" rx="12" fill="#eef2f8" stroke="#9eabc0"/>
  <text x="560" y="365" text-anchor="middle" fill="#172033" font-family="system-ui,sans-serif" font-size="18" font-weight="700">SQLite 事实账</text>
  <text x="560" y="397" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">保存任务、Spec 快照、命令、退出码和证据摘要</text>
  <text x="560" y="421" text-anchor="middle" fill="#a2393f" font-family="system-ui,sans-serif" font-size="14">不制造人工结论，不覆盖失败历史</text>
  <g stroke="#9eabc0" stroke-width="2" stroke-dasharray="7 6"><path d="M361 242V326"/><path d="M573 242V326"/><path d="M785 242V326"/></g>
  <path d="M984 242V470H149V248" fill="none" stroke="#2457d6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/>
  <text x="560" y="494" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">被接受的最小工作台开始登记后续建设任务。</text>
</svg>
