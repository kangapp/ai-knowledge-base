<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">L03 Spec 形成与审查链</title>
  <desc id="desc">八问访谈形成 V1，反例促成人工决定和修订版。解析器检查六部分结构，人工审查业务语义。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2457d6"/></marker></defs>
  <rect width="1120" height="540" rx="12" fill="#f8faff"/>
  <text x="54" y="56" fill="#172033" font-family="system-ui,sans-serif" font-size="25" font-weight="700">Spec 是经过反驳和确认的合同</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="54" y="110" width="190" height="88" rx="12" fill="#eef2f8" stroke="#9eabc0"/><text x="149" y="146" fill="#172033" font-size="17" font-weight="700">逐项访谈</text><text x="149" y="173" fill="#536078" font-size="14">使用者、公式、边界</text>
    <rect x="286" y="110" width="150" height="88" rx="12" fill="#e7edff" stroke="#2457d6"/><text x="361" y="146" fill="#172033" font-size="17" font-weight="700">V1</text><text x="361" y="173" fill="#536078" font-size="14">第一版合同</text>
    <rect x="478" y="110" width="166" height="88" rx="12" fill="#f8ecd7" stroke="#8a5718"/><text x="561" y="146" fill="#172033" font-size="17" font-weight="700">反例</text><text x="561" y="173" fill="#536078" font-size="14">空集、写失败、误公式</text>
    <rect x="686" y="110" width="166" height="88" rx="12" fill="#eef2f8" stroke="#9eabc0"/><text x="769" y="146" fill="#172033" font-size="17" font-weight="700">人工决定</text><text x="769" y="173" fill="#536078" font-size="14">取舍与业务口径</text>
    <rect x="894" y="110" width="172" height="88" rx="12" fill="#e2f2e9" stroke="#1f6b4c"/><text x="980" y="146" fill="#172033" font-size="17" font-weight="700">确认版 Spec</text><text x="980" y="173" fill="#536078" font-size="14">驱动实现与验收</text>
  </g>
  <g stroke="#2457d6" stroke-width="3" marker-end="url(#a)"><path d="M244 154H281"/><path d="M436 154H473"/><path d="M644 154H681"/><path d="M852 154H889"/></g>
  <rect x="54" y="274" width="620" height="188" rx="12" fill="#eef2f8" stroke="#9eabc0"/>
  <text x="84" y="312" fill="#172033" font-family="system-ui,sans-serif" font-size="18" font-weight="700">解析器检查结构</text>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#536078">
    <text x="84" y="350">来源　目标　非目标</text><text x="84" y="382">约束　验收用例　完成定义</text>
    <text x="84" y="427" fill="#2457d6" font-weight="700">只回答：六部分是否存在、格式是否可消费</text>
  </g>
  <rect x="714" y="274" width="352" height="188" rx="12" fill="#e7edff" stroke="#2457d6"/>
  <text x="744" y="312" fill="#172033" font-family="system-ui,sans-serif" font-size="18" font-weight="700">人检查语义</text>
  <text x="744" y="350" fill="#536078" font-family="system-ui,sans-serif" font-size="14">行粒度是否满足使用目的</text>
  <text x="744" y="382" fill="#536078" font-family="system-ui,sans-serif" font-size="14">8 - 3 = 5 与 4 - 1 = 3 是否成立</text>
  <text x="744" y="427" fill="#a2393f" font-family="system-ui,sans-serif" font-size="14" font-weight="700">结构通过，公式错误，仍必须退回</text>
  <path d="M980 198V236H364V269" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M980 198V269" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#a)"/>
  <text x="560" y="506" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">解析通过不是业务正确，模型起草也不是合同自动生效。</text>
</svg>
