<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Workbench V0 四层全景</title>
  <desc id="desc">人负责决定，工作台控制层包含记录、规则、合同与执行。Codex 在隔离候选中修改，独立复验者检查，FlowERP 客户产品与控制层分离。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2457d6"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9 0L0 4.5L9 9Z" fill="#536078"/></marker></defs>
  <rect width="1120" height="720" rx="12" fill="#f8faff"/>
  <text x="54" y="54" fill="#172033" font-family="system-ui,sans-serif" font-size="25" font-weight="700">Workbench V0：控制层与客户产品层分离</text>
  <rect x="346" y="90" width="428" height="84" rx="12" fill="#e7edff" stroke="#2457d6"/>
  <text x="560" y="124" text-anchor="middle" fill="#172033" font-family="system-ui,sans-serif" font-size="19" font-weight="700">人：目标、口径、授权、最终决定</text>
  <text x="560" y="151" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">决定向下传递，证据与风险向上返回</text>
  <rect x="166" y="228" width="788" height="270" rx="12" fill="#eef2f8" stroke="#9eabc0" stroke-width="2"/>
  <text x="198" y="265" fill="#172033" font-family="system-ui,sans-serif" font-size="19" font-weight="700">工作台控制层</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="208" y="302" width="190" height="132" rx="12" fill="#f8faff" stroke="#9eabc0"/><text x="303" y="337" fill="#2457d6" font-size="16" font-weight="700">记录层</text><text x="303" y="367" fill="#536078" font-size="13">SQLite 事实账</text><text x="303" y="391" fill="#536078" font-size="13">任务、快照、证据</text>
    <rect x="422" y="302" width="190" height="132" rx="12" fill="#f8faff" stroke="#9eabc0"/><text x="517" y="337" fill="#2457d6" font-size="16" font-weight="700">规则与合同层</text><text x="517" y="367" fill="#536078" font-size="13">AGENTS.md</text><text x="517" y="391" fill="#536078" font-size="13">确认版 Spec</text>
    <rect x="636" y="302" width="276" height="132" rx="12" fill="#e7edff" stroke="#2457d6"/><text x="774" y="337" fill="#2457d6" font-size="16" font-weight="700">执行层</text><text x="774" y="367" fill="#536078" font-size="13">能力信封、写集、超时</text><text x="774" y="391" fill="#536078" font-size="13">命令、范围检查、Eval、review</text>
  </g>
  <path d="M560 174V223" stroke="#2457d6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M532 228V181" stroke="#536078" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#b)"/>
  <rect x="46" y="550" width="300" height="112" rx="12" fill="#f8ecd7" stroke="#8a5718"/>
  <text x="196" y="588" text-anchor="middle" fill="#172033" font-family="system-ui,sans-serif" font-size="18" font-weight="700">独立复验者</text>
  <text x="196" y="618" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">从原始 Spec 检查同一候选</text>
  <text x="196" y="642" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">不继承执行者成功结论</text>
  <rect x="410" y="550" width="300" height="112" rx="12" fill="#e7edff" stroke="#2457d6"/>
  <text x="560" y="588" text-anchor="middle" fill="#172033" font-family="system-ui,sans-serif" font-size="18" font-weight="700">隔离候选与 Codex</text>
  <text x="560" y="618" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">在写集内产生候选 Diff</text>
  <text x="560" y="642" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">无权自行扩大范围或签收</text>
  <rect x="774" y="550" width="300" height="112" rx="12" fill="#e2f2e9" stroke="#1f6b4c"/>
  <text x="924" y="588" text-anchor="middle" fill="#172033" font-family="system-ui,sans-serif" font-size="18" font-weight="700">FlowERP 客户产品</text>
  <text x="924" y="618" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">独立代码与业务数据库</text>
  <text x="924" y="642" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="14">业务状态不等于任务状态</text>
  <path d="M774 434V506H560V545" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M710 606H769" stroke="#2457d6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M410 606H351" stroke="#536078" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#b)"/>
  <text x="560" y="698" text-anchor="middle" fill="#536078" font-family="system-ui,sans-serif" font-size="13">Hook 是后续自动触发层，不在 V0 必经链中。</text>
</svg>
