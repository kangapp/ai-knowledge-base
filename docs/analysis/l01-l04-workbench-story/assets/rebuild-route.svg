<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">最小工作台复建路线</title>
  <desc id="desc">从工作台合同开始，依次建立事实账、基础命令、长期规则、需求合同、受控执行和真实小需求。每一层都有正常路径、失败路径与停止条件。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2457d6"/></marker></defs>
  <rect width="1120" height="620" rx="12" fill="#f8faff"/>
  <text x="54" y="56" fill="#172033" font-family="system-ui,sans-serif" font-size="25" font-weight="700">逐层复建，当前层不过就停下</text>
  <path d="M128 310H995" stroke="#9eabc0" stroke-width="4"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(110 0)"><circle cx="0" cy="310" r="22" fill="#2457d6"/><text x="0" y="316" fill="#fff" font-size="15" font-weight="700">1</text><rect x="-68" y="138" width="136" height="112" rx="12" fill="#e7edff" stroke="#2457d6"/><text x="0" y="177" fill="#172033" font-size="15" font-weight="700">工作台 Spec</text><text x="0" y="205" fill="#536078" font-size="13">定义完成与非目标</text></g>
    <g transform="translate(260 0)"><circle cx="0" cy="310" r="22" fill="#2457d6"/><text x="0" y="316" fill="#fff" font-size="15" font-weight="700">2</text><rect x="-68" y="365" width="136" height="112" rx="12" fill="#eef2f8" stroke="#9eabc0"/><text x="0" y="404" fill="#172033" font-size="15" font-weight="700">SQLite 事实账</text><text x="0" y="432" fill="#536078" font-size="13">事务与历史</text></g>
    <g transform="translate(410 0)"><circle cx="0" cy="310" r="22" fill="#2457d6"/><text x="0" y="316" fill="#fff" font-size="15" font-weight="700">3</text><rect x="-68" y="138" width="136" height="112" rx="12" fill="#eef2f8" stroke="#9eabc0"/><text x="0" y="177" fill="#172033" font-size="15" font-weight="700">基础命令</text><text x="0" y="205" fill="#536078" font-size="13">确定性入口</text></g>
    <g transform="translate(560 0)"><circle cx="0" cy="310" r="22" fill="#2457d6"/><text x="0" y="316" fill="#fff" font-size="15" font-weight="700">4</text><rect x="-68" y="365" width="136" height="112" rx="12" fill="#e7edff" stroke="#2457d6"/><text x="0" y="404" fill="#172033" font-size="15" font-weight="700">长期规则</text><text x="0" y="432" fill="#536078" font-size="13">双路径验证</text></g>
    <g transform="translate(710 0)"><circle cx="0" cy="310" r="22" fill="#2457d6"/><text x="0" y="316" fill="#fff" font-size="15" font-weight="700">5</text><rect x="-68" y="138" width="136" height="112" rx="12" fill="#eef2f8" stroke="#9eabc0"/><text x="0" y="177" fill="#172033" font-size="15" font-weight="700">六部分 Spec</text><text x="0" y="205" fill="#536078" font-size="13">结构与语义</text></g>
    <g transform="translate(860 0)"><circle cx="0" cy="310" r="22" fill="#2457d6"/><text x="0" y="316" fill="#fff" font-size="15" font-weight="700">6</text><rect x="-68" y="365" width="136" height="112" rx="12" fill="#eef2f8" stroke="#9eabc0"/><text x="0" y="404" fill="#172033" font-size="15" font-weight="700">受控执行</text><text x="0" y="432" fill="#536078" font-size="13">写集、Eval、review</text></g>
    <g transform="translate(1010 0)"><circle cx="0" cy="310" r="22" fill="#1f6b4c"/><text x="0" y="316" fill="#fff" font-size="15" font-weight="700">7</text><rect x="-68" y="138" width="136" height="112" rx="12" fill="#e2f2e9" stroke="#1f6b4c"/><text x="0" y="177" fill="#172033" font-size="15" font-weight="700">真实小需求</text><text x="0" y="205" fill="#536078" font-size="13">独立复验与人审</text></g>
  </g>
  <path d="M110 93H1010" stroke="#2457d6" stroke-width="3" marker-end="url(#a)"/>
  <text x="110" y="92" fill="#2457d6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">建设顺序</text>
  <rect x="235" y="526" width="650" height="52" rx="10" fill="#f8e5e7" stroke="#a2393f"/>
  <text x="560" y="558" text-anchor="middle" fill="#a2393f" font-family="system-ui,sans-serif" font-size="14" font-weight="700">任一层缺少正常路径、失败路径或停止条件，就返回该层修复。</text>
</svg>
