services:
  pipeline:
    image: ${PIPELINE_IMAGE:-ghcr.io/kangapp/ai-knowledge-base:latest}
    env_file: .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      retries: 3
      start_period: 10s

  web:
    image: caddy:alpine
    ports:
      - "8090:80"
    environment:
      - KB_DOMAIN=${KB_DOMAIN:-kb.your-domain.com}
    volumes:
      - ./output:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    depends_on:
      - pipeline
