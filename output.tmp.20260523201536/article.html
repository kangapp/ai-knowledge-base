<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
    <a href="/">首页</a> |
    <a href="/dashboard.html">仪表盘</a> |
    <a href="/dag.html">DAG</a> |
    <a href="/config.html">配置</a>
</nav>
    <main>
<div id="article-detail"><p>加载中...</p></div>
<script>
const id = new URLSearchParams(location.search).get('id');
if (id) fetch('/api/articles/' + id).then(r => r.json()).then(res => {
    const a = res.data;
    document.getElementById('article-detail').innerHTML = `
        <h1>${a.title}</h1>
        <div class="meta">${a.source_detail || a.source} · ${a.collected_at ? a.collected_at.slice(0,10) : ''}</div>
        <a href="${a.url}" target="_blank">查看原文</a>
        <div class="summary">${a.summary || ''}</div>
        <div class="meta-footer">评分: ${a.relevance_score} · 花费: $${a.analysis_cost || 0}</div>
    `;
});
</script>
</main>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script defer src="/static/js/app.js"></script>
</body>
</html>
