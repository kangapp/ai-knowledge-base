- generic [ref=e2]: "{\"code\":0,\"data\":{\"items\":[{\"id\":122,\"title\":\"Google新推出的任意到任意AI模型引发关注\",\"url\":\"https://www.theverge.com/tech/936507/gemini-omni-hands-on-deepfake-ai-video\",\"description\":\"Last year I deepfaked my kid's stuffed animal to make it look like his plush deer was on vacation. It was an experiment to see if I could re-create the events depicted in a Gemini ad Google was running, and I never showed the videos of Buddy the deer on his adventures to my four-year-old. [&#8230;]\",\"summary\":\"文章介绍了作者去年通过深度伪造技术为孩子毛绒玩具制作度假视频的实验，旨在重现Google Gemini广告中的场景。这篇文章是对Google Gemini Omni模型的深度体验测试，探讨了AI视频生成和深度伪造技术的最新发展。作者分享了将毛绒鹿Buddy变成度假者的创作过程，反映出当前AI模型在多模态内容生成方面的强大能力，以及这类技术可能带来的创意应用与伦理挑战。\",\"source\":\"rss\",\"source_detail\":\"The Verge AI\",\"relevance_score\":88,\"status\":\"approved\",\"retry_count\":0,\"collected_at\":\"2026-05-23T11:33:55.696029+00:00\",\"published_at\":\"2026-05-23T07:00:00-04:00\",\"extra_data\":\"{\\\"dimensions\\\": {\\\"ai_relevance\\\": {\\\"score\\\": 32, \\\"reason\\\": \\\"文章核心内容是作者对Google Gemini Omni模型进行深度体验测试，重点涉及AI视频生成和深度伪造技术，贴合AI多模态内容生成领域，主题高度AI相关。标签中的Google Gemini、AI视频生成均为明确的AI技术关键词。\\\"}, \\\"content_depth\\\": {\\\"score\\\": 22, \\\"reason\\\": \\\"文章包含作者详细的个人创作过程（将毛绒鹿Buddy变成度假者制作视频），并延伸至对AI视频生成技术的多维度探讨，同时触及创意应用与伦理挑战的讨论，具备一定深度，非浅层新闻简讯。\\\"}, \\\"information_density\\\": {\\\"score\\\": 18, \\\"reason\\\": \\\"基于The Verge的原创深度体验报告，包含真实创作案例和技术伦理分析，信息来源于一手实际测试，非重复营销内容，为有信息量的原创报道。\\\"}, \\\"时效性\\\": {\\\"score\\\": 16, \\\"reason\\\": \\\"文章主题明确标注为Google新推出的Gemini Omni模型，属于本周内科技热点事件，时效性很强。\\\"}}, \\\"language\\\": \\\"zh\\\", \\\"raw\\\": {\\\"feed\\\": \\\"https://www.theverge.com/rss/index.xml\\\"}}\",\"analysis_cost\":0.0,\"analysis_tokens\":0,\"created_at\":\"2026-05-23 11:44:29\",\"updated_at\":\"2026-05-23 11:44:29\",\"tags\":[\"深度伪造\",\"Google Gemini\",\"AI视频生成\"]},{\"id\":123,\"title\":\"Meta 推出 Forum 应用：融合 Reddit、Facebook 群组和 AI 的社交新体验\",\"url\":\"https://www.theverge.com/tech/936290/meta-forum-facebook-groups-app-hands-on\",\"description\":\"Meta's new Forum app for iPhones takes Facebook Groups and moves them to a dedicated app with a dedicated AI chatbot to go with it, like an AI revamp of the ill-fated Groups app Facebook shut down in 2017. Rather than going to ChatGPT or tacking \\\"Reddit\\\" onto the end of a Google search, Forum [&#8230;]\",\"summary\":\"Meta 发布了全新的 Forum 应用，专为 iPhone 用户设计。该应用将 Facebook 群组功能独立出来，整合了类似 Reddit 的社区讨论模式、Facebook 的群组社交功能，以及内置 AI 聊天机器人。从功能上看，Forum 可以被视为 2017 年被 Facebook 关停的 Groups 应用的 AI 升级版。用户无需再单独使用 ChatGPT 或在 Google 搜索后添加「Reddit」来查找社区讨论，直接在 Forum 内即可获得 AI 支持的社区交流体验。\",\"source\":\"rss\",\"source_detail\":\"The Verge AI\",\"relevance_score\":77,\"status\":\"approved\",\"retry_count\":0,\"collected_at\":\"2026-05-23T11:33:55.696029+00:00\",\"published_at\":\"2026-05-22T13:27:08-04:00\",\"extra_data\":\"{\\\"dimensions\\\": {\\\"ai_relevance\\\": {\\\"score\\\": 35, \\\"reason\\\": \\\"核心主题围绕内置AI聊天机器人和AI支持的社区交流体验，Forum应用明确将AI作为核心功能整合到社交平台中，属于AI应用场景落地。\\\"}, \\\"content_depth\\\": {\\\"score\\\": 20, \\\"reason\\\": \\\"提供了具体功能描述（整合Reddit讨论模式、Facebook群组功能、AI聊天机器人）、产品背景（2017年Groups应用的升级版）、用户场景分析（解决单独使用ChatGPT的不便），有实质性内容。\\\"}, \\\"information_density\\\": {\\\"score\\\": 10, \\\"reason\\\": \\\"包含新应用的具体功能特点、与历史产品的对比、用户痛点解决方案，但缺少技术细节或独家数据，主要是对The Verge报道的摘要。\\\"}, \\\"timeliness\\\": {\\\"score\\\": 12, \\\"reason\\\": \\\"本周内的科技新闻，报道Meta新产品发布，时效性强。\\\"}}, \\\"language\\\": \\\"zh\\\", \\\"raw\\\": {\\\"feed\\\": \\\"https://www.theverge.com/rss/index.xml\\\"}}\",\"analysis_cost\":0.0,\"analysis_tokens\":0,\"created_at\":\"2026-05-23 11:44:29\",\"updated_at\":\"2026-05-23 11:44:29\",\"tags\":[\"Meta\",\"Forum\",\"AI聊天机器人\"]},{\"id\":124,\"title\":\"Elon, stop trying to make Grok happen\",\"url\":\"https://www.theverge.com/ai-artificial-intelligence/936219/elon-stop-trying-to-make-grok-happen\",\"description\":\"There is a harsh truth about Elon Musk's \\\"truth-seeking\\\" AI chatbot Grok: It's not very good, and not many people are using it. That's the takeaway of a new Reuters report, which found that Grok barely appears in federal records of how the US government used AI last year. It's not the only sign xAI's [&#8230;]\",\"summary\":\"关于埃隆·马斯克的\\\"求真\\\"AI聊天机器人Grok，有一个残酷的现实：它不太好用，使用的人也不多。路透社新报告显示，在去年美国政府使用AI的联邦记录中，Grok几乎看不到身影。这并非个例，xAI的Grok正面临产品竞争力不足和市场采用率低的双重挑战，其在AI市场的地位远未达到预期。\",\"source\":\"rss\",\"source_detail\":\"The Verge AI\",\"relevance_score\":73,\"status\":\"approved\",\"retry_count\":0,\"collected_at\":\"2026-05-23T11:33:55.696029+00:00\",\"published_at\":\"2026-05-22T13:17:06-04:00\",\"extra_data\":\"{\\\"dimensions\\\": {\\\"ai_relevance\\\": {\\\"score\\\": 38, \\\"reason\\\": \\\"文章核心讨论Grok——xAI公司的AI聊天机器人产品，直接涉及AI/LLM产品本身，符合35-40分区间。\\\"}, \\\"content_depth\\\": {\\\"score\\\": 17, \\\"reason\\\": \\\"摘要提供产品体验差、用户少、市场采用率低等多维度信息，有具体数据来源支撑，但文章类型偏评论性，分析深度有限，定在15-24分区间的中间位置。\\\"}, \\\"information_density\\\": {\\\"score\\\": 9, \\\"reason\\\": \\\"引用路透社联邦记录数据作为量化支撑，论点有凭有据；但'Grok不好用'属于常见批评，Grok市场表现不佳也并非独家信息，定在7-11分区间。\\\"}, \\\"timeliness\\\": {\\\"score\\\": 9, \\\"reason\\\": \\\"文章提及'去年'美国政府AI使用记录，说明引用了近期数据；但Grok产品竞争力问题已持续一段时间，定在7-11分区间的中间偏低位置。\\\"}}, \\\"language\\\": \\\"en\\\", \\\"raw\\\": {\\\"feed\\\": \\\"https://www.theverge.com/rss/index.xml\\\"}}\",\"analysis_cost\":0.0,\"analysis_tokens\":0,\"created_at\":\"2026-05-23 11:44:29\",\"updated_at\":\"2026-05-23 11:44:29\",\"tags\":[\"xAI\",\"Grok\",\"AI chatbot\"]},{\"id\":117,\"title\":\"Peec: 柏林AI搜索追踪创业公司年收入突破千万美元\",\"url\":\"https://techcrunch.com/2026/05/23/peec-one-of-berlins-rising-startups-more-than-doubled-annualized-revenue-in-months-to-10m-sources-say/\",\"description\":\"Peec, which helps brands track their presence in AI searches, offers proof of a key trend among European startups.\",\"summary\":\"柏林创业公司Peec专注于帮助品牌追踪其在AI搜索中的存在，在短短几个月内实现了年化收入翻倍增长至1000万美元。该公司的发展印证了欧洲创业公司领域的一个重要趋势，即AI应用相关的企业服务正在快速增长。Peec作为新兴的AI搜索优化工具提供商，展示了在生成式AI时代，企业对于理解和优化AI搜索可见性的强烈需求。这一领域正在吸引越来越多的投资关注。\",\"source\":\"rss\",\"source_detail\":\"TechCrunch AI\",\"relevance_score\":77,\"status\":\"approved\",\"retry_count\":0,\"collected_at\":\"2026-05-23T11:33:53.097929+00:00\",\"published_at\":\"Sat, 23 May 2026 07:01:00 +0000\",\"extra_data\":\"{\\\"dimensions\\\": {\\\"ai_relevance\\\": {\\\"score\\\": 36, \\\"reason\\\": \\\"文章核心主题为AI搜索可见性追踪服务，属于AI应用层面的企业服务领域。Peec的产品直接服务于企业在生成式AI搜索中的优化需求，与LLM驱动的搜索场景高度相关，符合AI应用范畴。\\\"}, \\\"content_depth\\\": {\\\"score\\\": 18, \\\"reason\\\": \\\"提供了公司背景（柏林创业公司）、收入数据（1000万美元年化收入）、增长声明（数月内翻倍）等基础信息，但未深入展开技术实现原理、竞争格局或创始人访谈等深度内容，属于带有'消息人士称'的新闻简报类报道。\\\"}, \\\"information_density\\\": {\\\"score\\\": 9, \\\"reason\\\": \\\"包含明确的收入数字、增长率及欧洲AI企业服务趋势等有价值信息，但核心内容为典型商业新闻叙事，无独家数据或创新性观点，属于有信息量但密度中等的报道。\\\"}, \\\"timeliness\\\": {\\\"score\\\": 14, \\\"reason\\\": \\\"文章日期标注为2026年5月23日，距今约一周左右，属于本周内发布的最新报道，时效性评分较高。\\\"}}, \\\"language\\\": \\\"zh\\\", \\\"raw\\\": {\\\"feed\\\": \\\"https://techcrunch.com/feed/\\\"}}\",\"analysis_cost\":0.0,\"analysis_tokens\":0,\"created_at\":\"2026-05-23 11:44:29\",\"updated_at\":\"2026-05-23 11:44:29\",\"tags\":[\"AI搜索\",\"创业公司\",\"柏林\"]},{\"id\":118,\"title\":\"AI技术被用于复活已故飞行员的声音\",\"url\":\"https://techcrunch.com/2026/05/22/ai-is-being-used-to-resurrect-the-voices-of-dead-pilots/\",\"description\":\"People used AI on a spectrogram image of cockpit recordings to reconstruct them, forcing the NTSB to temporarily block access to its docket system.\",\"summary\":\"研究人员利用AI技术对驾驶舱录音的频谱图图像进行处理，成功重建了已故飞行员的声音。这一技术突破引发了严重的隐私和安全担忧，迫使美国国家运输安全委员会（NTSB）暂时封锁了其案件档案系统的访问权限。该事件凸显了AI语音合成技术在隐私保护和法律监管方面面临的挑战，同时也引发了对逝者声音权利的伦理讨论。随着AI技术的快速发展，如何在技术创新与个人权益保护之间寻求平衡已成为亟待解决的问题。\",\"source\":\"rss\",\"source_detail\":\"TechCrunch AI\",\"relevance_score\":76,\"status\":\"approved\",\"retry_count\":0,\"collected_at\":\"2026-05-23T11:33:53.097929+00:00\",\"published_at\":\"Fri, 22 May 2026 23:03:33 +0000\",\"extra_data\":\"{\\\"dimensions\\\": {\\\"ai_relevance\\\": {\\\"score\\\": 37, \\\"reason\\\": \\\"核心主题是AI语音合成技术在航空安全领域的应用，涉及频谱图图像处理和声音重建，明确属于AI核心技术（语音合成/生成式AI）的应用案例，与AI直接相关。\\\"}, \\\"content_depth\\\": {\\\"score\\\": 20, \\\"reason\\\": \\\"提供了技术背景（频谱图处理）、具体事件（NTSB封锁访问）、多方影响（隐私安全、伦理讨论）的完整叙述，但未深入技术细节或展开系统性分析，属于有细节的概述性报道。\\\"}, \\\"information_density\\\": {\\\"score\\\": 10, \\\"reason\\\": \\\"提供了TechCrunch来源、具体技术手段、主要利益相关方（NTSB）以及多维度影响分析（隐私、安全、伦理、法律监管），信息含量较为丰富，但缺乏独家数据或独家观点。\\\"}, \\\"timeliness\\\": {\\\"score\\\": 9, \\\"reason\\\": \\\"来源标注为2026年5月22日的TechCrunch报道，属于本月内新闻，具有较好的时效性，但非本周突发。\\\"}}, \\\"language\\\": \\\"zh\\\", \\\"raw\\\": {\\\"feed\\\": \\\"https://techcrunch.com/feed/\\\"}}\",\"analysis_cost\":0.0,\"analysis_tokens\":0,\"created_at\":\"2026-05-23 11:44:29\",\"updated_at\":\"2026-05-23 11:44:29\",\"tags\":[\"AI语音合成\",\"航空安全\",\"隐私保护\"]}],\"total\":5,\"page\":1,\"page_size\":5},\"message\":\"ok\"}"