[project]
name = "ai-knowledge-base"
version = "0.1.0"
description = "个人 AI 知识库 — 自动化采集、分析、展示"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "apscheduler>=3.10",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "langfuse>=2.0",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
