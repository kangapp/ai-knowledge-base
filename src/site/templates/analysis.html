{% extends "base.html" %}
{% block title %}分析{% endblock %}
{% block content %}
<div class="deep-page">
    <header class="content-page-header">
        <h1>分析</h1>
        <p class="page-subtitle">展示手工沉淀的专题分析页面。</p>
    </header>

    <section class="deep-list" aria-label="分析页面列表">
        {% for page in analysis_pages %}
        <article class="deep-list-item">
            <div class="deep-list-main">
                <div class="deep-list-header">
                    <div class="deep-list-title-group">
                        <h2><a href="{{ page.url }}">{{ page.title }}</a></h2>
                    </div>
                </div>
            </div>
        </article>
        {% else %}
        <div class="loading">暂无分析页面</div>
        {% endfor %}
    </section>
</div>
{% endblock %}
