agents:
  github_analyzer:
    model:
      primary: { provider: minimax, model: MiniMax-M3 }
      fallback: []
    params: { temperature: 0.3, max_tokens: 2048 }
    prompt: prompts/github_analyzer.md
    budget_weight: 1.0

  rss_analyzer:
    model:
      primary: { provider: minimax, model: MiniMax-M3 }
      fallback: []
    params: { temperature: 0.3, max_tokens: 2048 }
    prompt: prompts/rss_analyzer.md
    budget_weight: 1.0

  feishu_analyzer:
    model:
      primary: { provider: minimax, model: MiniMax-M3 }
      fallback: []
    params: { temperature: 0.3, max_tokens: 2048 }
    prompt: prompts/feishu_analyzer.md
    budget_weight: 1.0

  arxiv_analyzer:
    model:
      primary: { provider: minimax, model: MiniMax-M3 }
      fallback: []
    params: { temperature: 0.3, max_tokens: 4096 }
    prompt: prompts/arxiv_analyzer.md
    budget_weight: 1.0

  reviewer:
    model:
      primary: { provider: minimax, model: MiniMax-M3 }
      fallback: []
    params: { temperature: 0.0, max_tokens: 1024, concurrency: 3, timeout_seconds: 60 }
    prompt: prompts/reviewer.md
    budget_weight: 0.5

  deep_report:
    model:
      primary: { provider: minimax, model: MiniMax-M3 }
      fallback: []
    params: { temperature: 0.2, max_tokens: 8192 }
    prompt: prompts/deep_report.md
    budget_weight: 1.0

budget:
  monthly: 10.0
  soft_limit: 0.8
  hard_limit: 1.0
