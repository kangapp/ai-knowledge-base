agents:
  github_analyzer:
    model:
      primary: { provider: minimax, model: MiniMax-M2.7 }
      fallback: []
    params: { temperature: 0.3, max_tokens: 2048 }
    prompt: prompts/github_analyzer.md
    budget_weight: 1.0

  rss_analyzer:
    model:
      primary: { provider: minimax, model: MiniMax-M2.7 }
      fallback: []
    params: { temperature: 0.3, max_tokens: 2048 }
    prompt: prompts/rss_analyzer.md
    budget_weight: 1.0

  feishu_analyzer:
    model:
      primary: { provider: minimax, model: MiniMax-M2.7 }
      fallback: []
    params: { temperature: 0.3, max_tokens: 2048 }
    prompt: prompts/feishu_analyzer.md
    budget_weight: 1.0

  arxiv_analyzer:
    model:
      primary: { provider: minimax, model: MiniMax-M2.7 }
      fallback: []
    params: { temperature: 0.3, max_tokens: 4096 }
    prompt: prompts/arxiv_analyzer.md
    budget_weight: 1.0

  reviewer:
    model:
      primary: { provider: minimax, model: MiniMax-M2.7 }
      fallback: []
    params: { temperature: 0.0, max_tokens: 1024 }
