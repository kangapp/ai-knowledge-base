sources:
  # ===== GitHub Trending =====
  - id: github_trending
    name: GitHub Trending AI
    type: github
    enabled: true
    priority: 1
    cron: "0 */6 * * *"
    max_items: 10
    config:
      topics: [llm, artificial-intelligence, machine-learning, rag, mcp]
      keywords: ["AI agent", "multi-agent", "LLM", "RAG", "MCP"]
      exclude_terms: [wallpaper, porn, nsfw, account, registration, card]
      min_stars: 50
      min_forks: 10
      min_watchers: 20
      lookback_days: 7

  - id: github_trending_hot
    name: GitHub 持续热门
    type: github
    enabled: true
    priority: 1
    cron: "0 */6 * * *"
    max_items: 10
    config:
      topics: [llm, artificial-intelligence, machine-learning, rag, mcp]
      keywords: ["AI agent", "multi-agent", "LLM", "RAG", "MCP"]
      exclude_terms: [wallpaper, porn, nsfw, account, registration, card]
      lookback_type: pushed      # 用 pushed_at 而非 created：查询 90 天内有活跃 push 的仓库
      lookback_days: 90
      min_stars: 2000
      min_forks: 50
      min_watchers: 100
      trend_mode: false

  - id: github_trending_velocity
    name: GitHub 趋势增速
    type: github
    enabled: true
    priority: 1
    cron: "0 */6 * * *"
    max_items: 10
    config:
      topics: [llm, artificial-intelligence, machine-learning, rag, mcp]
      keywords: ["AI agent", "multi-agent", "LLM", "RAG", "MCP"]
      exclude_terms: [wallpaper, porn, nsfw, account, registration, card]
      min_stars: 10
      lookback_days: 30
      trend_mode: true
      trend_velocity_threshold: 10

  - id: github_ai_devtools
    name: GitHub AI 开发工具
    type: github
    enabled: true
    priority: 1
    cron: "0 */6 * * *"
    max_items: 10
    config:
      topics: []
      keywords: ["interactive knowledge graph", "codebase knowledge graph", "code understanding", "codebase understanding", "repository analysis"]
      exclude_terms: [wallpaper, porn, nsfw, account, registration, card]
      lookback_type: pushed
      lookback_days: 90
      min_stars: 100
      min_forks: 0
      min_watchers: 0

  # ===== 中文科技媒体 =====
  - id: rss_36kr
    name: 36氪
    type: rss
    enabled: true
    priority: 2
    cron: "0 */4 * * *"
    max_items: 10
    config:
      url: "https://36kr.com/feed"
      filter_keywords: [AI, AI4S, LLM, 大模型, Agent, 人工智能, 具身智能, ChatGPT, DeepSeek, OpenAI, Anthropic, 豆包, Kimi, 通义, 智谱]
      filter_scope: title

  - id: rss_huxiu
    name: 虎嗅
    type: rss
    enabled: false
    priority: 2
    cron: "0 */4 * * *"
    max_items: 10
    config:
      url: "https://www.huxiu.com/rss/feed"
      filter_keywords: [AI, LLM, 大模型, 人工智能, ChatGPT, Agent, OpenAI, DeepSeek, 豆包, Kimi, 通义, 智谱]
      filter_scope: title

  - id: rss_juejin
    name: 稀土掘金
    type: rss
    enabled: false
    priority: 2
    cron: "0 */4 * * *"
    max_items: 10
    config:
      url: "https://api.juejin.cn/rss"
      filter_keywords: [AI, 大模型, LLM, 机器学习, Agent, RAG, LangChain]
      filter_scope: title

  - id: rss_ithome
    name: IT之家
    type: rss
    enabled: true
    priority: 2
    cron: "0 */4 * * *"
    max_items: 10
    config:
      url: "https://www.ithome.com/rss/"
      filter_keywords: [AI, LLM, 大模型, ChatGPT, OpenAI, DeepSeek, 人工智能]
      filter_scope: title

  # ===== 国际 AI / 科技媒体 =====
  - id: rss_techcrunch
    name: TechCrunch AI
    type: rss
    enabled: true
    priority: 3
    cron: "0 */6 * * *"
    max_items: 10
    config:
      url: "https://techcrunch.com/feed/"
      filter_keywords: [AI, artificial intelligence, machine learning, LLM, OpenAI, Anthropic]
      filter_scope: title

  - id: rss_verge
    name: The Verge AI
    type: rss
    enabled: true
    priority: 3
    cron: "0 */6 * * *"
    max_items: 10
    config:
      url: "https://www.theverge.com/rss/index.xml"
      filter_keywords: [AI, artificial intelligence, machine learning]
      filter_scope: title

  - id: rss_arstechnica
    name: Ars Technica
    type: rss
    enabled: true
    priority: 3
    cron: "0 8 * * *"
    max_items: 10
    config:
      url: "https://feeds.arstechnica.com/arstechnica/index"
      filter_keywords: [AI, artificial intelligence, machine learning, LLM, OpenAI]
      filter_scope: title

  - id: rss_reuters
    name: Reuters Science
    type: rss
    enabled: false
    priority: 3
    cron: "0 8 * * *"
    max_items: 10
    config:
      url: "https://feeds.reuters.com/reuters/scienceNews"
      filter_keywords: [AI, artificial intelligence, machine learning, OpenAI]
      filter_scope: title

  - id: rss_producthunt
    name: Product Hunt
    type: rss
    enabled: true
    priority: 3
    cron: "0 9 * * *"
    max_items: 10
    config:
      url: "https://www.producthunt.com/feed"
      filter_keywords: [AI, artificial intelligence]
      filter_scope: title

  - id: rss_arxiv
    name: arXiv AI/ML
    type: arxiv
    enabled: true
    priority: 3
    cron: "0 11 * * 1"
    max_items: 10
    config:
      categories: [cs.AI, cs.CL, cs.LG]
      keywords: [LLM, agent, RAG, transformer]
      lookback_days: 7

  # ===== 飞书 =====
  - id: feishu
    name: 飞书知识文档
    type: feishu
    enabled: false
    priority: 3
    cron: "0 10 * * *"
    max_items: 10
    config:
      space_ids: []
